repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.21
    hooks:
      - id: ruff-check
        files: ^(scripts/(build-title-images|build-shared-packages|check-material-links)\.py|tests/.*\.py)$
      - id: ruff-format
        files: ^(scripts/(build-title-images|build-shared-packages|check-material-links)\.py|tests/.*\.py)$
